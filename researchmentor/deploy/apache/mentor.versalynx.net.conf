# /etc/apache2/sites-available/mentor.versalynx.net.conf
# Apache 2.4 + PHP-FPM (proxy_fcgi). Enable modules first:
#   a2enmod rewrite headers ssl http2 proxy proxy_fcgi setenvif expires
#   a2enconf php8.3-fpm   # (optional; this vhost sets the handler explicitly)

<VirtualHost *:80>
    ServerName mentor.versalynx.net
    # Let's Encrypt HTTP-01 challenges must stay reachable over HTTP; everything else goes to HTTPS.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
    DocumentRoot /var/www/researchmentor/public
    <Directory /var/www/researchmentor/public/.well-known>
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/mentor-error.log
    CustomLog ${APACHE_LOG_DIR}/mentor-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName mentor.versalynx.net
    ServerAdmin admin@versalynx.net
    Protocols h2 http/1.1

    # ONLY the public/ directory is web-reachable. app/, config/, storage/, vendor/, .env live above it.
    DocumentRoot /var/www/researchmentor/public

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/mentor.versalynx.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/mentor.versalynx.net/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    <Directory /var/www/researchmentor/public>
        Options -Indexes -MultiViews +FollowSymLinks
        # public/.htaccess holds the front-controller rewrite rules
        AllowOverride All
        Require all granted
    </Directory>

    # PHP is executed through a dedicated PHP-FPM pool (see deploy/php/researchmentor-pool.conf)
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.3-fpm-researchmentor.sock|fcgi://localhost"
    </FilesMatch>

    # Uploads: keep in step with upload_max_filesize / post_max_size (deploy/php/99-researchmentor.ini)
    LimitRequestBody 31457280
    # AI requests can take a while when QUEUE_DRIVER=sync; with the database queue + worker requests are short
    Timeout 150
    ProxyTimeout 150

    # Defence in depth (the application also sends these headers)
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always unset X-Powered-By
    ServerSignature Off

    # Never serve dotfiles, VCS metadata or backups even if misplaced under public/
    <FilesMatch "^\.(?!well-known)|\.(env|git|sql|bak|log|ini|lock|md)$">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/mentor-error.log
    CustomLog ${APACHE_LOG_DIR}/mentor-access.log combined
</VirtualHost>
