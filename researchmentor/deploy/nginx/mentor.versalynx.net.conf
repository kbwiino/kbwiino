# /etc/nginx/sites-available/mentor.versalynx.net.conf
# Used instead of deploy/apache/ when nginx already serves ports 80/443 on the server (for example alongside
# Jitsi Meet). deploy/scripts/provision.sh installs it and adapts the paths, PHP version, domain and, when nginx
# multiplexes port 443 by SNI, the internal TLS port (the "listen ... 443 ..." lines below).

server {
    listen 80;
    listen [::]:80;
    server_name mentor.versalynx.net;

    # Let's Encrypt HTTP-01 challenges (certbot --webroot -w /var/www/letsencrypt); everything else goes to HTTPS.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mentor.versalynx.net;

    # ONLY the public/ directory is web-reachable. app/, config/, storage/, vendor/, .env live above it.
    root /var/www/researchmentor/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/mentor.versalynx.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mentor.versalynx.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Uploads: keep in step with upload_max_filesize / post_max_size in the PHP-FPM pool
    client_max_body_size 30m;
    server_tokens off;

    # Defence in depth (the application also sends these headers; hide its copies to avoid duplicates)
    fastcgi_hide_header X-Powered-By;
    fastcgi_hide_header X-Content-Type-Options;
    fastcgi_hide_header X-Frame-Options;
    fastcgi_hide_header Strict-Transport-Security;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Never serve dotfiles, VCS metadata or backups even if misplaced under public/
    location ~ /\.(?!well-known/) {
        deny all;
    }
    location ~* \.(env|git|sql|bak|log|ini|lock|md)$ {
        deny all;
    }

    location ~* \.(css|js|woff2|png|svg|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Real static files are served directly; everything else goes to the front controller
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Only the front controller is ever executed
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass unix:/run/php/php8.3-fpm-researchmentor.sock;
        # AI requests can take a while when QUEUE_DRIVER=sync; with the database queue + worker requests are short
        fastcgi_read_timeout 150s;
    }
    location ~ \.php$ {
        return 404;
    }

    access_log /var/log/nginx/mentor-access.log;
    error_log  /var/log/nginx/mentor-error.log;
}
