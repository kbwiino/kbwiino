; /etc/php/8.3/fpm/conf.d/99-researchmentor.ini   (and cli/conf.d for bin/worker.php with relaxed limits)
expose_php = Off
memory_limit = 256M
max_execution_time = 120
max_input_time = 60
upload_max_filesize = 26M      ; MAX_UPLOAD_MB=25 in .env; keep the web layer slightly above it
post_max_size = 30M
max_file_uploads = 5
file_uploads = On

; Sessions (the app also sets these per request)
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.gc_maxlifetime = 7200

; OPcache
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0      ; run "systemctl reload php8.3-fpm" after each deploy (deploy.sh does this)
