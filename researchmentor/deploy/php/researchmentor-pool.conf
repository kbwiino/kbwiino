; /etc/php/8.3/fpm/pool.d/researchmentor.conf
[researchmentor]
user = rmapp
group = rmapp
listen = /run/php/php8.3-fpm-researchmentor.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20          ; size to RAM: ~60-80 MB per child for typical requests
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500         ; recycle workers regularly
request_terminate_timeout = 140s

; Isolation: the app can only touch its own tree, its private storage and temp
php_admin_value[open_basedir] = /var/www/researchmentor:/var/lib/researchmentor:/tmp:/usr/share/php
php_admin_value[upload_tmp_dir] = /var/lib/researchmentor/tmp
php_admin_value[session.save_path] = /var/lib/researchmentor/sessions
php_admin_value[error_log] = /var/www/researchmentor/storage/logs/php-error.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,show_source,highlight_file,dl
php_admin_flag[allow_url_fopen] = off
env[APP_ENV] = production
